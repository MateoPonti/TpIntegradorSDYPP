apiVersion: v1
kind: ConfigMap
metadata:
  name: miners-config
  namespace: tpi-miners
data:
  # Dominio público del gateway (A2, 27/11): Cloudflare -> Traefik -> Service gateway en GKE. El token viaja
  # cifrado y sí, es la única puerta: el Service dejó de tener IP pública propia, y a la IP del cluster solo
  # entran los rangos de Cloudflare. Si esto no resuelve, los mineros de esta PC no minan.
  GATEWAY_URL: https://gateway.sdmer.dpdns.org
  MINER_KIND: cpu
  # Nombre de ESTA PC / cluster (cambiarlo en cada una): queda al principio del id de cada minero.
  MINER_CLUSTER: pc-mateo
  # Cuenta donde cobran el premio TODOS los pods de esta PC (sus partes se suman). Cambiarla en cada una.
  MINER_ACCOUNT: mateo
