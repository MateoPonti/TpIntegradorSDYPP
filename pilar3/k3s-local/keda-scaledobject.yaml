# Option a) KEDA (https://keda.sh) in the k3s, installed once with Helm:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
#
# The metrics-api scaler polls GET {GATEWAY_URL}/scaling, reads the field
# desired_cpu_miners that the pool computes (0 while a GPU miner is alive) and,
# with targetValue 1, sets replicas = desired_cpu_miners (between min and max).
# RabbitMQ is private in GKE, so the queue length reaches the k3s through
# this signal, not through the KEDA rabbitmq scaler.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: miner-cpu
  namespace: tpi-miners
spec:
  scaleTargetRef:
    name: miner-cpu
  minReplicaCount: 0
  maxReplicaCount: 8
  pollingInterval: 5   # cada 5 s: la primera tx sin pods arranca en ~15-20 s
  # A3-h (26/11): quién decide cuándo bajar a 0 es el pool, no KEDA. El pool ya espera
  # CPU_IDLE_SECONDS (60 s) sin trabajo antes de informar desired_cpu_miners = 0
  # (pool/decision.py, desired_cpu_miners). Con cooldownPeriod: 120 el apagado tardaba
  # 60 + 120 = ~180 s, que es lo que midió el profe. Acá queda en un pollingInterval:
  # KEDA baja apenas ve el 0 y el tiempo total es el del pool (~60 s, medido ≤ 70 s).
  # Si hay que cambiar ese tiempo, se cambia CPU_IDLE_SECONDS del pool, no esto.
  cooldownPeriod: 5
  triggers:
    - type: metrics-api
      metadata:
        url: https://gateway.35-223-237-60.sslip.io/scaling
        valueLocation: desired_cpu_miners
        targetValue: "1"
        authMode: bearer
      authenticationRef:
        name: gateway-bearer
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: gateway-bearer
  namespace: tpi-miners
spec:
  secretTargetRef:
    - parameter: token
      name: gateway-auth
      key: scaling-token   # solo lectura de /scaling (21/11): KEDA no tiene un token con el que se pueda minar
