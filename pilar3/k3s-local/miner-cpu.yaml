# CPU miners outside Google Cloud. They talk only to the HTTP gateway:
# ask for a task, send the result, send a keep-alive. The token comes from
# the gateway-auth Secret, created in the k3s by Pipeline 4 or by hand:
#   kubectl -n tpi-miners create secret generic gateway-auth \
#     --from-literal=miner-token="$MINER_TOKEN"
# The replica count is owned by the autoscaler (KEDA or your own loop).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miner-cpu
  namespace: tpi-miners
spec:
  selector:
    matchLabels:
      app: miner-cpu
  template:
    metadata:
      labels:
        app: miner-cpu
    spec:
      # A miner can die mid task: the gateway lease expires and the task
      # goes back to the queue (TASK_LEASE_SECONDS in GKE).
      #
      # C5 (27/11): con SIGTERM el agente ya no muere de golpe. Termina el tramo que está minando
      # (MINER_CHUNK), devuelve lo prestado con release?reason=shutdown y sale con 0. Los 20 s le
      # tienen que alcanzar para cerrar el tramo más largo; si se sube MINER_CHUNK, subir esto.
      terminationGracePeriodSeconds: 20
      containers:
        - name: miner
          image: MINER_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: miners-config
          env:
            # Id = <cluster>-<pod>: único aunque varias PCs corran este mismo Deployment
            # (el gateway lleva el hashrate, la calibración y el premio por id).
            - name: MINER_CLUSTER
              valueFrom:
                configMapKeyRef:
                  name: miners-config
                  key: MINER_CLUSTER
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MINER_ID
              value: "$(MINER_CLUSTER)-$(POD_NAME)"
            - name: MINER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: miner-token
          resources:
            # Leave room for the rest of your machine: the k3s is your PC.
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            # Con la raíz de solo lectura, el agente necesita /tmp: ahí van los logs rotativos
            # (LOG_DIR=/tmp/logs) y la clave Ed25519 del worker (/tmp/sdmer/<miner_id>.key, porque el HOME de
            # la imagen no es escribible). La clave se pierde al reiniciarse el pod y el worker se da de alta
            # de nuevo en su primer authorize, que es lo que ya pasaba antes de este cambio.
            - name: tmp
              mountPath: /tmp
      # B2 (27/11): van al final del pod spec para no pisar el bloque de arriba, que lo cambia la Task 7.
      serviceAccountName: miner-cpu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
