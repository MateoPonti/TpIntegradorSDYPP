# B2 (27/11/2026): una ServiceAccount por servicio.
#
# Sin esto los cuatro usan la ServiceAccount `default` del namespace, así que cualquier permiso que se le dé a
# uno se lo queda todo el namespace, y en los logs de auditoría de GCP todos los pedidos a la API aparecen como
# "system:serviceaccount:tpi:default": no se puede saber quién hizo qué.
#
# Ninguno de los cuatro le habla a la API de Kubernetes (la coordinación es con Redis: `coord:leader` y
# `pool:leader`), así que ninguno necesita el token montado. Por eso cada Deployment lleva
# `automountServiceAccountToken: false`: si alguno se escapa, el atacante no se encuentra un token de la API
# en /var/run/secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: tpi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pool
  namespace: tpi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: tpi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifier
  namespace: tpi
automountServiceAccountToken: false
