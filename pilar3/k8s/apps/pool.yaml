# Transaction pool (P5): splits nonce ranges, tracks the miner keep-alives
# (they arrive through the gateway) and, when no GPU miner is alive, lowers
# the prefix and publishes how many CPU miners the group k3s should run.
# It does not create machines: no miner runs in Google Cloud (TPI policy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool
  namespace: tpi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pool
  template:
    metadata:
      labels:
        app: pool
    spec:
      # Sin esto k8s inyecta REDIS_PORT=tcp://... (por el Service "redis") y pisa la config.
      enableServiceLinks: false
      nodeSelector:
        pool: apps
      containers:
        - name: pool
          image: REGISTRY/pool:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tpi-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
