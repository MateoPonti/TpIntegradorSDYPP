# HTTP gateway for the external miners (CPU in the group k3s, GPU in a PC,
# Colab or the course GPU cluster). No miner runs in GKE: the GCP free trial
# forbids crypto mining and has no GPUs. The gateway is the only door:
#   GET  /tasks/next   hands out a task (it consumes RabbitMQ on the miner behalf)
#   POST /results      receives a solution and forwards it to the coordinator
#   POST /keepalive    miner heartbeat (type cpu|gpu), written to Redis
#   GET  /scaling      scaling signal published by the pool (used by KEDA
#                      or by your own autoscaler in the k3s)
# Every call carries "Authorization: Bearer <token>" (Secret gateway-auth).
# RabbitMQ and Redis stay private.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tpi
spec:
  # No "replicas" field: the HPA owns it (minReplicas: 2). With the field,
  # every kubectl apply would reset the size the HPA chose.
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Sin esto k8s inyecta REDIS_PORT=tcp://... (por el Service "redis") y pisa la config.
      enableServiceLinks: false
      nodeSelector:
        pool: apps
      serviceAccountName: gateway
      automountServiceAccountToken: false   # no le habla a la API de Kubernetes (B2)
      securityContext:
        # Corre como 10001, el mismo usuario que el Dockerfile: ni el pod ni la imagen asumen root.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: REGISTRY/gateway:latest
          securityContext:
            allowPrivilegeEscalation: false   # ni con un binario setuid se gana root
            readOnlyRootFilesystem: true      # el único lugar donde escribe es /tmp (emptyDir)
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tpi-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: MINER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: miner-token
            # Token de solo lectura para KEDA (GET /scaling), separado del de los mineros (21/11). Opcional.
            - name: SCALING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: scaling-token
                  optional: true
          # Al apagarse (el HPA saca réplicas o hay rollout), sigue atendiendo 10 s mientras Kubernetes lo saca del
          # Service. Sin esto, los pedidos que llegan en esos segundos fallan (medido el 20/11: 142 errores en 10.000).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            # requests are mandatory: the HPA computes utilization against them
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            # Con la raíz de solo lectura hay que darle un lugar donde escribir: los logs rotativos van a
            # LOG_DIR=/tmp/logs (lo fija el Dockerfile) y ahí también escriben uvicorn y Python.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tpi
spec:
  # A2 (27/11/2026): era LoadBalancer con la IP estática tpi-gateway (34.63.209.225). Ahora es ClusterIP: los
  # mineros de afuera (k3s, Colab, la GPU) entran por https://gateway.sdmer.dpdns.org, que es Cloudflare ->
  # Traefik -> este Service. Mientras hubo una IP pública propia, el gateway tenía dos puertas: una con TLS,
  # rate limit y WAF de Cloudflare, y otra en claro que las saltaba todas. Con ClusterIP queda una sola.
  # La IP reservada se puede liberar después de la entrega (gcloud compute addresses delete tpi-gateway).
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: tpi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Miners poll in bursts: without a window the HPA flaps between blocks.
      stabilizationWindowSeconds: 300  # 20/11: con 120 s bajaba de 5 a 2 en plena carga
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: tpi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway
