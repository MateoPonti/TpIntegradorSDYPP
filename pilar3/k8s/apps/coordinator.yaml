# Coordinator (NCT) + public API. Two replicas as the TPI requires: that
# means two processes may try to close the same block. Solve it (Redis lock
# with SET NX PX, or a single leader) and explain it in the README.
# The HPA below scales it with the load of section 3.3 (never below 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: tpi
spec:
  # No "replicas" field: the HPA owns it (minReplicas: 2). With the field,
  # every kubectl apply would reset the size the HPA chose.
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      # Sin esto k8s inyecta REDIS_PORT=tcp://... (por el Service "redis") y pisa la config.
      enableServiceLinks: false
      nodeSelector:
        pool: apps
      serviceAccountName: coordinator
      automountServiceAccountToken: false   # no le habla a la API de Kubernetes (B2)
      securityContext:
        # Corre como 10001, el mismo usuario que el Dockerfile: ni el pod ni la imagen asumen root.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: REGISTRY/coordinator:latest
          securityContext:
            allowPrivilegeEscalation: false   # ni con un binario setuid se gana root
            readOnlyRootFilesystem: true      # el único lugar donde escribe es /tmp (emptyDir)
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tpi-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          # Al apagarse (el HPA saca réplicas o hay rollout), sigue atendiendo 10 s mientras Kubernetes lo saca del
          # Service. Sin esto, los pedidos que llegan en esos segundos fallan (medido el 20/11: 142 errores en 10.000).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            # Con la raíz de solo lectura hay que darle un lugar donde escribir: los logs rotativos van a
            # LOG_DIR=/tmp/logs (lo fija el Dockerfile) y ahí también escriben uvicorn y Python.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: tpi
spec:
  # Desde el 17/11 la IP fija tpi-coordinator (35.223.237.60) la tiene Traefik (pilar3/k8s/https), que da HTTPS
  # y pasa todo al coordinator: este Service queda interno.
  type: ClusterIP
  selector:
    app: coordinator
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coordinator
  namespace: tpi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coordinator
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 20/11: con 120 s bajaba de 5 a 2 en plena carga
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coordinator
  namespace: tpi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: coordinator
