# Dominio propio del front (20/11/2026): https://sdmer.duckdns.org (DuckDNS, gratis; el registro A apunta a la IP
# fija 35.223.237.60 de Traefik y se cambia a mano en duckdns.org si cambia la IP).
#   kubectl apply -f pilar3/k8s/https/sdmer.yaml
# - HTTPS: certificado propio de Let's Encrypt (cert-manager, se renueva solo).
# - HTTP de este nombre redirige a HTTPS (301). Solo este nombre: http://35.223.237.60 (bench.py, /status) y el
#   gateway de los mineros siguen igual. Necesita providers.kubernetesCRD en Traefik (traefik-values.yaml).
# - Las reglas con host le ganan a la regla sin host del Ingress "tpi" (Traefik prioriza la regla más larga), y la
#   ruta del desafío ACME (/.well-known/acme-challenge/...) le gana al redirect por lo mismo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: a-https
  namespace: tpi
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdmer
  namespace: tpi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sdmer.duckdns.org]
      secretName: sdmer-tls
  rules:
    - host: sdmer.duckdns.org
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: notifier
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coordinator
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sdmer-http
  namespace: tpi
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tpi-a-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sdmer.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coordinator
                port:
                  name: http
