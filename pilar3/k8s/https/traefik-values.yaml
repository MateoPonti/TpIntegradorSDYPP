# Traefik (helm chart traefik/traefik) como Ingress controller del TPI. Recibe HTTP y HTTPS en la IP fija
# tpi-coordinator y reparte por nombre al coordinator y al gateway. Se usa Traefik y no ingress-nginx porque
# ingress-nginx dejó de mantenerse (retirado por la comunidad de Kubernetes en 2026).
#   helm repo add traefik https://traefik.github.io/charts
#   helm upgrade --install traefik traefik/traefik -n traefik --create-namespace -f pilar3/k8s/https/traefik-values.yaml
service:
  spec:
    loadBalancerIP: 35.223.237.60   # IP estática tpi-coordinator (antes la tenía el Service del coordinator)
    # A2 (27/11/2026): al LoadBalancer solo entra Cloudflare. Sin esto el dominio es decoración: cualquiera
    # puede pedirle http://35.223.237.60/ a la IP y saltearse el proxy, el WAF y el rate limit de Cloudflare
    # (el profe lo pidió explícitamente). GKE convierte esta lista en la regla de firewall del LB; los health
    # checks de Google entran por una regla aparte que administra GKE, así que no hay que agregarlos acá.
    # Lista oficial: https://www.cloudflare.com/ips-v4 (15 rangos, al 27/11/2026). Si Cloudflare la cambia,
    # pilar3/tests/test_dominio.py no se entera: hay que mirar la página y hacer `helm upgrade` de nuevo.
    loadBalancerSourceRanges:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
# A2: todo lo que llegue por http se contesta con 301 a https, sin importar el nombre ni la ruta. Cloudflare ya
# lo hace en el borde con "Always Use HTTPS", pero el redirect tiene que estar también acá: si no, un pedido que
# entre por http directo al LB (el día que la lista de arriba se abra, o desde otro servicio de Cloudflare) se
# atendería en claro. Como el 301 sale para cualquier ruta, no delata qué rutas existen.
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
nodeSelector:
  pool: apps
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi
ingressClass:
  enabled: true
  isDefaultClass: false
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true   # Middlewares e IngressRoutes de Traefik (pilar3/k8s/https/privado.yaml)
