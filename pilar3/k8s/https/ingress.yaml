# HTTPS del TPI con certificados gratis de Let's Encrypt que saca y renueva cert-manager.
#   helm repo add jetstack https://charts.jetstack.io
#   helm upgrade --install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true
#   kubectl apply -f pilar3/k8s/https/ingress.yaml
# Nombres: sslip.io resuelve <lo-que-sea>.35-223-237-60.sslip.io a 35.223.237.60, así no hace falta comprar un
# dominio (Let's Encrypt no da certificados para una IP sola). HTTP sigue andando para bench.py y los mineros
# que ya están configurados; el navegador y los workers nuevos usan HTTPS.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-cuenta
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tpi
  namespace: tpi
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [35-223-237-60.sslip.io, gateway.35-223-237-60.sslip.io]
      secretName: tpi-tls
  rules:
    - host: 35-223-237-60.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coordinator
                port:
                  name: http
    - host: gateway.35-223-237-60.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
    # Sin host: lo que llega a http://35.223.237.60 (bench.py, /status) va al coordinator, como antes. Es una
    # regla y no defaultBackend porque Traefik no usa el defaultBackend del Ingress.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coordinator
                port:
                  name: http
