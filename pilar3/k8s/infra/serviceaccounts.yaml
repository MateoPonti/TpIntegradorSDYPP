# B2 (27/11/2026): ServiceAccount propia para Redis y RabbitMQ, por lo mismo que las de los servicios
# (pilar3/k8s/apps/serviceaccounts.yaml). Van en este directorio y no en el de las apps porque el Pipeline 2
# aplica `infra/` antes que `apps/`: si la ServiceAccount llegara después, los StatefulSets no arrancarían.
#
# RabbitMQ tiene el plugin rabbitmq_peer_discovery_k8s habilitado, pero la configuración del cluster usa el
# backend `k8s` sin consultar la API (el pod -0 arranca el cluster y los demás se unen por nombre DNS, ver el
# comentario de rabbitmq.yaml), así que tampoco necesita el token de la API montado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: tpi
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: tpi
automountServiceAccountToken: false
