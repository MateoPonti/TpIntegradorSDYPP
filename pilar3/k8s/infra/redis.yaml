# Redis con AOF: acá vive la cadena (NCT.4). Son 3 pods: 1 principal y 2 réplicas, y en cada pod un
# Sentinel. Si se cae el principal, los Sentinel que quedan (2 de 3 alcanza) ascienden a una réplica.
# Los servicios no le hablan a un pod fijo: le preguntan a Sentinel quién es el principal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-scripts
  namespace: tpi
data:
  # Quién es el principal ahora: lo que diga algún Sentinel de los otros pods. Si no contesta
  # ninguno (primer arranque o se reinició todo), el principal es redis-0.
  find-master.sh: |
    ME="$(hostname).redis-headless.tpi.svc.cluster.local"
    MASTER=""
    for i in 0 1 2; do
      S="redis-$i.redis-headless.tpi.svc.cluster.local"
      [ "$S" = "$ME" ] && continue
      A=$(timeout 3 redis-cli -h "$S" -p 26379 -a "$REDIS_PASSWORD" --no-auth-warning \
            sentinel get-master-addr-by-name tpi 2>/dev/null | head -1)
      case "$A" in redis-*) MASTER="$A"; break ;; esac
    done
    [ -z "$MASTER" ] && MASTER="redis-0.redis-headless.tpi.svc.cluster.local"
  redis.sh: |
    . /scripts/find-master.sh
    set -- redis-server --appendonly yes --appendfsync everysec \
      --requirepass "$REDIS_PASSWORD" --masterauth "$REDIS_PASSWORD" \
      --replica-announce-ip "$ME" --replica-announce-port 6379
    if [ "$MASTER" != "$ME" ]; then
      echo "arranco como réplica de $MASTER"
      set -- "$@" --replicaof "$MASTER" 6379
    else
      echo "arranco como principal"
    fi
    exec "$@"
  sentinel.sh: |
    . /scripts/find-master.sh
    echo "sentinel vigila a $MASTER"
    cat > /sentinel/sentinel.conf <<EOF
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel announce-ip $ME
    requirepass $REDIS_PASSWORD
    sentinel sentinel-pass $REDIS_PASSWORD
    sentinel monitor tpi $MASTER 6379 2
    sentinel auth-pass tpi $REDIS_PASSWORD
    sentinel down-after-milliseconds tpi 5000
    sentinel failover-timeout tpi 20000
    sentinel parallel-syncs tpi 1
    EOF
    exec redis-server /sentinel/sentinel.conf --sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: tpi
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      # B2 (27/11): corre como el usuario `redis` de la imagen (uid 999, gid 1000; verificado con
      # `docker run --rm --entrypoint sh redis:7.4-alpine -c 'id redis'`). Hasta ahora arrancaba como root:
      # el entrypoint de la imagen solo baja a `redis` cuando el comando es `redis-server`, y acá el comando es
      # `sh /scripts/redis.sh`, así que nunca bajaba. fsGroup deja el PVC y el emptyDir escribibles para ese
      # grupo (Kubernetes le pone el grupo y g+rwX al montarlo, también a los archivos AOF que ya están).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        pool: infra
      tolerations:
        - key: pool
          operator: Equal
          value: infra
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: redis
      containers:
        - name: redis
          image: redis:7.4-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Única excepción del endurecimiento (la lista está en pilar3/tests/test_manifiestos.py):
            # estas imágenes escriben fuera de su PVC durante el arranque —RabbitMQ instala la cookie de
            # Erlang y arma su config, Sentinel reescribe la suya— y no las escribimos nosotros, así que no
            # sabemos todo lo que tocan. Probar la raíz de solo lectura acá significa probarlo en el cluster
            # que tiene la cadena, y a 5 días de la entrega no es el momento. Queda en "Limitaciones" del
            # README del Pilar 3 con el riesgo real: es el contenedor con más superficie, pero igual no
            # corre como root, no puede escalar privilegios y no tiene ninguna capability.
            readOnlyRootFilesystem: false
          command: ["sh", "/scripts/redis.sh"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
        - name: sentinel
          image: redis:7.4-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Única excepción del endurecimiento (la lista está en pilar3/tests/test_manifiestos.py):
            # estas imágenes escriben fuera de su PVC durante el arranque —RabbitMQ instala la cookie de
            # Erlang y arma su config, Sentinel reescribe la suya— y no las escribimos nosotros, así que no
            # sabemos todo lo que tocan. Probar la raíz de solo lectura acá significa probarlo en el cluster
            # que tiene la cadena, y a 5 días de la entrega no es el momento. Queda en "Limitaciones" del
            # README del Pilar 3 con el riesgo real: es el contenedor con más superficie, pero igual no
            # corre como root, no puede escalar privilegios y no tiene ninguna capability.
            readOnlyRootFilesystem: false
          command: ["sh", "/scripts/sentinel.sh"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p 26379 -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: "200m"
              memory: 64Mi
          volumeMounts:
            - name: sentinel
              mountPath: /sentinel
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: redis-scripts
        # Sentinel reescribe su config (réplicas y otros Sentinel que descubre); se rearma en cada arranque.
        - name: sentinel
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless: nombres DNS fijos por pod (redis-0.redis-headless...), que es lo que anuncian Redis y Sentinel.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: tpi
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
    - name: sentinel
      port: 26379
---
# Para los servicios: le preguntan acá quién es el principal (REDIS_SENTINELS en tpi-config).
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: tpi
spec:
  selector:
    app: redis
  ports:
    - name: sentinel
      port: 26379
