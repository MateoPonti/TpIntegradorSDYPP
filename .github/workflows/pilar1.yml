# Minimal CI for Pilar 1. GitHub-hosted runners have no GPU, so this job
# compiles the CUDA miner (nvcc does not need a GPU) and runs the contract
# checks against the CPU oracle. GPU runs happen on your machine / Colab.
# Movido a la raíz desde pilar1/ (GitHub solo lee .github/workflows/ de la raíz).
# gitleaks corre en ci.yml sobre todo el historial.
name: pilar1

on:
  push:
    paths: ["pilar1/**", ".github/workflows/pilar1.yml"]
  pull_request:
    paths: ["pilar1/**", ".github/workflows/pilar1.yml"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pilar1
    steps:
      - uses: actions/checkout@v7
      - name: Install nvcc (compiler only, about 330 MB)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-12-8 cuda-cudart-dev-12-8
          echo /usr/local/cuda-12.8/bin >> "$GITHUB_PATH"
      - name: Build the miner (sm_61 = GTX 1050 Ti del grupo)
        run: make ARCH=sm_61
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Kit tests and oracle contract
        run: |
          python -m pip install --quiet pytest
          make test
          make check-oracle
          python3 tools/check_contract.py -- python3 cpu/miner_cpu.py --workers 2
      - uses: actions/upload-artifact@v7
        with:
          name: miner_gpu
          path: pilar1/build/miner_gpu
