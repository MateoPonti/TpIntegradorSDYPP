# Pipeline 1: builds the Kubernetes cluster, node pools, registry and CI/CD
# identity with OpenTofu. No miner infrastructure: no miner runs in GCP. Plan on PR, apply only on main and only after a
# human approves the "production" environment (Settings > Environments).
name: 1-infra

on:
  pull_request:
    paths: ["pilar3/infra/terraform/**"]
  push:
    branches: [main]
    paths: ["pilar3/infra/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to request the OIDC token

env:
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_github_repo: ${{ github.repository }}

jobs:
  plan:
    # Se saltea hasta que carguen las variables de GCP en GitHub (ver pilar3/README.md)
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilar3/infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SA }}
      - uses: opentofu/setup-opentofu@v2
      - run: tofu fmt -check -recursive
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: pilar3/infra/terraform/tfplan

  apply:
    if: vars.GCP_WIF_PROVIDER != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: pilar3/infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SA }}
      - uses: opentofu/setup-opentofu@v2
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: pilar3/infra/terraform
      - run: tofu init -input=false
      - run: tofu apply -input=false tfplan
